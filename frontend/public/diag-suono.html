<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Diagnosi suono — Aurya</title>
<style>
  body{margin:0;padding:18px;background:#0C1618;color:#E9E4D9;
    font:15px/1.5 -apple-system,system-ui,sans-serif}
  h1{font-size:19px;margin:0 0 4px}
  p.sub{color:#8aa;margin:0 0 16px;font-size:13px}
  button{display:block;width:100%;margin:10px 0;padding:16px;
    font-size:16px;border-radius:12px;border:1px solid #2C5259;
    background:#1D3A3E;color:#E9E4D9}
  button:active{background:#2C5259}
  .esito{margin:4px 0 14px;padding:10px 12px;border-radius:10px;
    background:#111f22;font-size:13px;white-space:pre-wrap;
    font-family:ui-monospace,Menlo,monospace;min-height:18px}
  #stato{background:#0a1214;border:1px solid #1D3A3E}
  .ok{color:#7EC1BA}.no{color:#e08f8f}
  #copia{background:#7EC1BA;color:#08201D;font-weight:700}
</style>
</head>
<body>
<h1>Diagnosi del suono</h1>
<p class="sub">Tocca i pulsanti in ordine. Ognuno prova UN canale audio e
scrive l'esito. Alla fine tocca «Copia il rapporto» e incollalo in chat.</p>

<div class="esito" id="stato">stato: in attesa…</div>

<button id="t1">1 — Oscillatore → altoparlante (WebAudio puro)</button>
<div class="esito" id="e1"></div>

<button id="t2">2 — Oscillatore → ponte (MediaStream → &lt;audio&gt;)</button>
<div class="esito" id="e2"></div>

<button id="t3">3 — File audio in &lt;audio&gt; (come le anteprime)</button>
<div class="esito" id="e3"></div>

<button id="t4">4 — Sblocco con &lt;audio&gt; + oscillatore insieme</button>
<div class="esito" id="e4"></div>

<button id="copia">📋 Copia il rapporto</button>
<div class="esito" id="ecopia"></div>

<script src="/diag-suono.js"></script>
</body>
</html>
