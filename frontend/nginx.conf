# ── Frontend container nginx — internal only ─────────────────────
# This config runs INSIDE the frontend container (port 80).
# It serves the React build and returns index.html for SPA routes.
# The main reverse proxy (nginx-proxy container) handles TLS and
# proxies traffic here.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any route not matching a file → index.html
    # no-cache sull'HTML: e' la porta di ogni build — se il telefono
    # se la tiene, i deploy non arrivano (successo, 22/8)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (hashed filenames from CRA build)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Media e font (T8, 25/8/2026) ─────────────────────────────
    # MISURATO: il video dell'hero (1,6 MB) usciva con `no-cache` come
    # tutto cio' che non sta sotto /static/, perche' il blocco qui
    # sopra copre solo i file con l'hash nel nome. Il 304 funziona,
    # quindi il corpo non si riscaricava — ma ogni visita di ritorno
    # pagava un giro di rete per OGNI immagine, font e video.
    #
    # Una settimana e non un anno: questi nomi sono STABILI
    # (aurya-hero.mp4 resta aurya-hero.mp4 anche se il file cambia),
    # quindi `immutable` sarebbe una bugia — il giorno che il founder
    # sostituisce il video, chi l'ha in cache continuerebbe a vedere
    # il vecchio per dodici mesi. Sette giorni e' il compromesso:
    # niente giri di rete per chi torna, e un aggiornamento arriva
    # comunque entro la settimana.
    location ~* \.(mp4|webm|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Disable access to dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }
}
