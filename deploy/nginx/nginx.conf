# ── Aurya — Production Reverse Proxy ──────────────────
# Container nginx-proxy. Gestisce:
#   - terminazione TLS (Let's Encrypt via certbot)
#   - /api/*        → backend
#   - route SEO pubbliche → backend /__seo/* (meta iniettati server-side)
#   - sitemap/robots/IndexNow → backend
#   - tutto il resto (asset, route SPA admin) → frontend statico
#   - security headers
#
# Dominio: aurya.life (hardcoded — è il nostro, niente placeholder da
# sostituire a mano: il processo resta replicabile).

# Rate limit login (backup app-level slowapi)
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
# Rate limit signup (backup DOS: slowapi fa 5/15min, questo ferma il
# brute-force da un singolo IP prima che tocchi Python)
limit_req_zone $binary_remote_addr zone=signup:10m rate=5r/m;
# ES1 — /uploads e' pubblico per necessita' (debito noto): un ascolto
# vero apre poche richieste; 30 al minuto per IP fermano il
# raschiatore che vorrebbe svuotarci la banda, non l'ascoltatore.
limit_req_zone $binary_remote_addr zone=uploads:10m rate=30r/m;

server {
    listen 80;
    server_name aurya.life www.aurya.life;

    # ACME challenge per certbot (HTTP-01)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tutto il resto → HTTPS
    location / {
        return 301 https://aurya.life$request_uri;
    }
}

# www → apex (canonico su aurya.life senza www)
server {
    listen 443 ssl http2;
    server_name www.aurya.life;

    ssl_certificate     /etc/letsencrypt/live/aurya.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aurya.life/privkey.pem;

    return 301 https://aurya.life$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aurya.life;

    # ── TLS (gestito da certbot) ─────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/aurya.life/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aurya.life/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ── Security headers ─────────────────────────────────────────
    # HSTS: HTTPS-only per 1 anno. `preload` → candidabile alla lista
    # preload dei browser (submit su hstspreload.org DOPO 1 settimana
    # di soak). La rimozione dal preload richiede mesi.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # geolocation=(self): il "vicino a me" della directory usa la
    # posizione del browser (con consenso), quindi self, non ().
    # microphone=(self): la voce dell'operatore si REGISTRA nel sito —
    # il leggio in Crea (le meditazioni guidate) e la registrazione in
    # /sound/visual. Con microphone=() il browser rifiuta prima ancora
    # di chiedere il permesso all'utente («Microfono non disponibile o
    # permesso negato», trovato dal founder il 23/8). La camera resta
    # vietata: nessuna funzione la usa.
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self), payment=(self), usb=(), bluetooth=(), magnetometer=(), gyroscope=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # ── Content Security Policy ──────────────────────────────────
    # script-src 'self' 'unsafe-eval'  → bundle app; unsafe-eval per
    #     recharts/framer-motion (new Function). NO unsafe-inline.
    # style-src 'unsafe-inline'  → Tailwind/Radix iniettano <style>.
    # img-src ... https:  → tile OpenStreetMap (Leaflet), OG-image,
    #     loghi remoti. media-src 'self'  → video hero (locale /media).
    #     connect-src 'self'  → /api same-origin (Nominatim è server-side).
    # frame-src iframe.mediadelivery.net  → embed video corsi (Bunny).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.de.sentry.io https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; frame-src 'self' https://iframe.mediadelivery.net; media-src 'self' https: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; worker-src 'self' blob:; manifest-src 'self'" always;

    # Upload limit (allineato al backend F4)
    client_max_body_size 55m;

    # ── API → backend ────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        location /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/auth/signup {
            limit_req zone=signup burst=3 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/customer-auth/signup {
            limit_req zone=signup burst=3 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ── File caricati (audio, immagini, loghi) — ES1 (21/8) ──────
    # Serviti DIRETTAMENTE da nginx dal volume (sendfile del kernel,
    # Range nativo per il seek dell'audio): prima passavano tutti per
    # l'unico worker Python del backend — 55MB di base ambient
    # occupavano lo stesso event loop delle API. Il Range-shim nel
    # backend resta per il dev e come fallback.
    # IL MASTER (23/8): i mix pubblicati NON sono statici pubblici —
    # `internal` = solo via X-Accel-Redirect, dopo che il backend ha
    # verificato lo sblocco (il portiere). nginx serve i byte
    # (sendfile, Range per il seek), il backend non li tocca mai.
    location /uploads/masters/ {
        internal;
        alias /srv/uploads/masters/;
        sendfile on;
        tcp_nopush on;
        types { audio/mpeg mp3; }
    }

    location /uploads/ {
        alias /srv/uploads/;
        limit_req zone=uploads burst=20 nodelay;
        sendfile on;
        tcp_nopush on;
        # i file sono content-addressed (id nuovi a ogni upload):
        # immutabili per un anno, come dal backend.
        # NB: niente `expires` accanto ad add_header Cache-Control —
        # emettono la stessa intestazione DUE volte (visto in produzione
        # al primo giro). E Accept-Ranges lo manda gia' nginx da solo.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # NB: `types` in una location SOSTITUISCE la mappa ereditata:
        # va elencato tutto cio' che vive in uploads (audio, voce
        # registrata, immagini), o il resto esce octet-stream.
        types {
            audio/mp4 m4a mp4;
            audio/mpeg mp3;
            audio/ogg ogg;
            audio/wav wav;
            audio/webm webm;
            image/webp webp;
            image/png png;
            image/jpeg jpg jpeg;
            image/gif gif;
            image/svg+xml svg;
            text/plain txt;
        }
    }

    # ── SEO: sitemap (indice S3 + sotto-sitemap) → backend ───────
    # /sitemap.xml → /api/public/sitemap.xml ; /sitemap-core.xml → …-core.xml
    location ~ ^/sitemap([a-z-]*)\.xml$ {
        proxy_pass http://backend:8000/api/public/sitemap$1.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SEO: robots.txt + file chiave IndexNow (*.txt a root) → backend ──
    location ~ ^/[^/]+\.txt$ {
        proxy_pass http://backend:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SEO shell: home ──────────────────────────────────────────
    # Le pagine pubbliche escono dal backend con title/OG/JSON-LD già
    # iniettati (crawler social e Bing leggono l'HTML iniziale, non il
    # JS). Gli asset (/static, /media, favicon…) NON matchano qui →
    # vanno al frontend statico (blocco `location /` in fondo).
    location = / {
        proxy_pass http://backend:8000/__seo/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SEO shell: pagine di contenuto pubblico ──────────────────
    # ritiri, landing evento /e/, landing prodotto /p /ph /dg /co /r,
    # /operatori, /destinazioni, profilo /o/, store /s/, /blog, pagine
    # brand. Il match richiede la keyword seguita da `/` o fine stringa:
    # /orders, /reviews, /stores NON matchano (restano SPA admin).
    # ── LK10 (founder, 14/8): /l/{slug} DEVE potersi incorniciare ──
    # L'anteprima dell'editor pagina link e' un iframe same-origin su
    # /l/{slug}: gli header globali (X-Frame-Options DENY +
    # frame-ancestors 'none') la bloccavano in prod. Questa location
    # vince sul gruppo shell (prima regex che matcha) e replica gli
    # header di sicurezza del server con il SOLO framing allentato a
    # same-origin. NB: add_header in location AZZERA quelli del server,
    # vanno ridichiarati TUTTI.
    location ~ ^/l/[^/]+/?$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self), payment=(self), usb=(), bluetooth=(), magnetometer=(), gyroscope=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.de.sentry.io https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; frame-src 'self' https://iframe.mediadelivery.net; media-src 'self' https: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
        proxy_pass http://backend:8000/__seo$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(ritiri|e|p|ph|dg|co|r|operatori|destinazioni|o|s|l|blog|chi-siamo|come-funziona|cerca-ritiro|per-operatori|manifesto|newsletter|entra-nella-rete|sound)(/|$) {
        proxy_pass http://backend:8000/__seo$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── LK2: pagina link /@slug (bio Instagram) ──────────────────
    # OG dal backend: l'anteprima su WhatsApp deve mostrare foto e nome.
    location ~ ^/@[^/]+/?$ {
        proxy_pass http://backend:8000/__seo$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Tutto il resto → frontend statico ────────────────────────
    # Asset della build + route SPA private (/dashboard, /login,
    # /account, /inizia, /incassi, /visibilita, /reviews, /newsletter…).
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
